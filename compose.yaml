services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////data/creative_factory.db
      IMAGE_STORAGE_ROOT: /data/creative-assets
      GENERATION_PROVIDER: ${GENERATION_PROVIDER:-mock}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GENERATION_TIMEOUT_SECONDS: ${GENERATION_TIMEOUT_SECONDS:-20}
      VISUAL_MAX_ATTEMPTS: ${VISUAL_MAX_ATTEMPTS:-2}
      IMAGE_GENERATION_PROVIDER: ${IMAGE_GENERATION_PROVIDER:-disabled}
      IMAGE_MOCK_PATH: ${IMAGE_MOCK_PATH:-}
      IMAGE_MODEL: ${IMAGE_MODEL:-gemini-3.1-flash-image}
      IMAGE_SIZE: ${IMAGE_SIZE:-2K}
      IMAGE_TIMEOUT_SECONDS: ${IMAGE_TIMEOUT_SECONDS:-120}
      IMAGE_MAX_ATTEMPTS: ${IMAGE_MAX_ATTEMPTS:-2}
    volumes:
      - backend_data:/data
      - creative_images:/data/creative-assets
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build: ./paguemenos-FRONT-END
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:80"
    restart: unless-stopped

volumes:
  backend_data:
  creative_images:
